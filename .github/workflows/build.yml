name: build

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: ./run_osx.sh
      - name: Stage unpacked install files
        run: |
          mkdir -p artifacts-mac
          cp helper installer/mac/install.sh installer/mac/uninstall.sh installer/mac/README.txt artifacts-mac/
      - uses: actions/upload-artifact@v7
        with:
          name: mac-zip
          path: artifacts-mac/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: cmd
        run: run_win.bat
      - name: Stage unpacked install files
        shell: cmd
        run: |
          mkdir artifacts-win
          copy /Y clipboard-history-helper.exe artifacts-win\
          copy /Y installer\win\install.bat artifacts-win\
          copy /Y installer\win\uninstall.bat artifacts-win\
          copy /Y installer\win\README.txt artifacts-win\
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: artifacts-win/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev
      - name: Build
        run: ./run_linux.sh
      - name: Stage unpacked install files
        run: |
          mkdir -p artifacts-linux
          cp helper installer/linux/install.sh installer/linux/uninstall.sh installer/linux/README.txt artifacts-linux/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-zip
          path: artifacts-linux/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: linux.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh needs a git context to infer the repository (and --generate-notes
      # needs the tag checked out to compute notes against the right commit)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - name: Attach zips, checksums and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum mac.zip windows.zip linux.zip > SHA256SUMS
          gh release create "${{ github.ref_name }}" --draft --generate-notes || true
          gh release upload "${{ github.ref_name }}" mac.zip windows.zip linux.zip SHA256SUMS --clobber
