name: build

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./run_osx.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: run_win.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev
      - name: Build
        run: ./run_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: linux.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --generate-notes || true
          gh release upload "${{ github.ref_name }}" mac.zip windows.zip linux.zip --clobber
